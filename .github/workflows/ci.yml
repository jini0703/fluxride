name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --ignore-scripts
      
    - name: Build Web
      run: pnpm --filter @fluxride/web build
      
    - name: Build API
      run: pnpm --filter @fluxride/api build
      
    - name: Test API
      run: pnpm --filter @fluxride/api test || true
